<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e63946" />
      <stop offset="100%" stop-color="#c1121f" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" fill="url(#bgGrad)" rx="16" />

  <!-- Window Container -->
  <g transform="translate(40, 30)" filter="url(#shadow)">
    <!-- Window Frame -->
    <rect width="920" height="560" rx="12" fill="#ffffff" />
    
    <!-- Window Titlebar -->
    <path d="M 0 12 Q 0 0 12 0 L 908 0 Q 920 0 920 12 L 920 48 L 0 48 Z" fill="#0f172a" />
    <circle cx="24" cy="24" r="6" fill="#ef4444" />
    <circle cx="44" cy="24" r="6" fill="#f59e0b" />
    <circle cx="64" cy="24" r="6" fill="#10b981" />
    
    <!-- Browser Address Bar -->
    <rect x="180" y="10" width="560" height="28" rx="6" fill="#1e293b" />
    <text x="360" y="29" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">🔒 https://lifelink.org/search — Blood Matching</text>

    <!-- Top Navigation Header -->
    <rect x="0" y="48" width="920" height="56" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="30" y="84" fill="#e63946" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">🩸 LifeLink</text>
    
    <!-- Navigation Links -->
    <text x="140" y="82" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Home</text>
    <rect x="195" y="66" width="115" height="26" rx="13" fill="#fee2e2" />
    <text x="207" y="83" fill="#e63946" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Blood Matching</text>
    <text x="330" y="82" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Available Donors</text>
    <text x="460" y="82" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Emergency Alerts</text>
    <text x="590" y="82" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Compatibility</text>

    <!-- Main Content Area -->
    <g transform="translate(40, 125)">
      <!-- Page Badge & Title -->
      <rect x="0" y="0" width="140" height="22" rx="11" fill="#fee2e2" />
      <text x="12" y="15" fill="#e63946" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">⚡ CLINICAL MATCHING</text>
      
      <text x="0" y="48" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">Emergency Blood Matching</text>
      <text x="0" y="68" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Describe your emergency in plain English or Roman Urdu. LifeLink parses the request and matches compatible donors.</text>

      <!-- Search Input Card -->
      <rect x="0" y="88" width="840" height="100" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="20" y="118" fill="#1e293b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">Urgent need for O-negative blood for emergency surgery at Services Hospital Lahore</text>
      <text x="20" y="165" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Model: Meta LLaMA 3.1 8B Instant (Groq Hosted Inference) · Latency: 0.38s</text>
      
      <!-- Match Button -->
      <rect x="710" y="138" width="115" height="36" rx="6" fill="url(#primaryGrad)" />
      <text x="735" y="161" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Match Now</text>

      <!-- Parsed Output Result Card -->
      <g transform="translate(0, 205)">
        <rect x="0" y="0" width="840" height="180" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
        
        <!-- Header -->
        <rect x="0" y="0" width="840" height="42" rx="10" fill="#f1f5f9" />
        <text x="20" y="26" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">🔍 AI Request Analysis &amp; Clinical Compatibility</text>
        <rect x="730" y="10" width="90" height="22" rx="11" fill="#dcfce7" />
        <text x="742" y="25" fill="#166534" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">✓ Parsed</text>

        <!-- Chips Row -->
        <g transform="translate(20, 56)">
          <!-- Chip 1: Blood Group -->
          <rect x="0" y="0" width="140" height="44" rx="8" fill="#fef2f2" stroke="#fecaca" />
          <text x="12" y="18" fill="#991b1b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">BLOOD GROUP</text>
          <text x="12" y="36" fill="#e63946" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">O Negative (O-)</text>

          <!-- Chip 2: Location -->
          <rect x="155" y="0" width="140" height="44" rx="8" fill="#f0f9ff" stroke="#bae6fd" />
          <text x="167" y="18" fill="#0369a1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">CITY / REGION</text>
          <text x="167" y="36" fill="#0284c7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Lahore</text>

          <!-- Chip 3: Hospital -->
          <rect x="310" y="0" width="180" height="44" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
          <text x="322" y="18" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">DETECTED HOSPITAL</text>
          <text x="322" y="36" fill="#1e293b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Services Hospital</text>

          <!-- Chip 4: Urgency -->
          <rect x="505" y="0" width="130" height="44" rx="8" fill="#fef2f2" stroke="#fca5a5" />
          <text x="517" y="18" fill="#991b1b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">URGENCY LEVEL</text>
          <text x="517" y="36" fill="#dc2626" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">CRITICAL ⚡</text>

          <!-- Chip 5: Compatible Donors -->
          <rect x="650" y="0" width="150" height="44" rx="8" fill="#f0fdf4" stroke="#bbf7d0" />
          <text x="662" y="18" fill="#15803d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">COMPATIBLE TYPES</text>
          <text x="662" y="36" fill="#16a34a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">O- Only (Universal)</text>
        </g>

        <!-- Action Banner -->
        <rect x="20" y="118" width="800" height="48" rx="8" fill="#1d3557" />
        <text x="40" y="147" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">✓ 8 Registered O- Donors Available in Lahore</text>
        <rect x="630" y="126" width="175" height="32" rx="6" fill="#e63946" />
        <text x="645" y="146" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">View Matched Donors →</text>
      </g>
    </g>
  </g>
</svg>
